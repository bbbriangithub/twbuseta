<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus ETA 1.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            padding: 8px;
            width: 100%;
            overflow-x: hidden;
            font-size: 15px; /* Default for mobile / smart phone */
        }

        .title-line {
            font-weight: bold;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }

        /* Smart Phone default: 15px */
        @media (min-width: 600px) and (max-width: 900px) {
            body, .title-line, table.eta-table {
                font-size: 40px; /* Android tablet */
            }
        }

        @media (min-width: 901px) {
            body, .title-line, table.eta-table {
                font-size: 50px; /* iPad / Large screen */
            }
        }

        table.eta-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        table.eta-table th, 
        table.eta-table td {
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 6px 4px;
            vertical-align: middle;
        }

        table.eta-table th {
            font-weight: bold;
            border-bottom: 1px solid #333333;
            color: #dddddd;
        }

        /* Specified column widths */
        .col-dir { width: 20%; }
        .col-route { width: 20%; }
        .col-stop { width: 28%; }
        .col-eta { width: 32%; }

        .route-badge {
            background-color: #1d4ed8; /* Blue rectangular background */
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            font-weight: bold;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .eta-container {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow: hidden;
        }

        .eta-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            min-width: 1.8em;
        }

        /* ETA background colors */
        .eta-red {
            background-color: #dc2626; /* < 9 minutes or 到著 */
        }

        .eta-orange {
            background-color: #ea580c; /* >= 9 and <= 15 minutes */
        }

        .eta-green {
            background-color: #16a34a; /* > 15 minutes */
        }
    </style>
</head>
<body>
    <div id="titleContainer" class="title-line">荃景圍交通 --Loading--</div>

    <table class="eta-table">
        <thead>
            <tr>
                <th class="col-dir">開往</th>
                <th class="col-route">路線</th>
                <th class="col-stop">車站</th>
                <th class="col-eta">分鐘</th>
            </tr>
        </thead>
        <tbody id="etaTableBody">
            <!-- Dynamic rows will be inserted here -->
        </tbody>
    </table>

    <script>
        const instructions = [
            { busCoId: "KMB", route: "234A", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/9E970734315233A2/234A/1" },
            { busCoId: "KMB", route: "234B", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/9E970734315233A2/234B/1" },
            { busCoId: "KMB", route: "234X", direction: "尖沙咀", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/9E970734315233A2/234X/1" },
            { busCoId: "KMB", route: "40", direction: "麗港城", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/95797E4D2901A516/40/1" },
            { busCoId: "KMB", route: "48X", direction: "禾輋", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/D8F172EF79F3414D/48X/1" },
            { busCoId: "KMB", route: "34", direction: "葵盛", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/939FE9A08B99174C/34/1" },
            { busCoId: "KMB", route: "34M", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/939FE9A08B99174C/34M/1" },
            { busCoId: "KMB", route: "A38", direction: "機場", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/1D7A47D38CE1E6D7/A38/1" },
            { busCoId: "KMB", route: "934", direction: "灣仔", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/939FE9A08B99174C/934/1" },
            { busCoId: "KMB", route: "A38", direction: "荃景圍天橋", stopName: "機場", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/7CB61EFB024D9025/A38/1", specialDir: "I" },
            { busCoId: "KMB", route: "68A", direction: "青衣站", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED364A58F885DC92/68A/1" },
            { busCoId: "KMB", route: "58M", direction: "屯門", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/12E6D91298FABAEE/58M/1" },
            { busCoId: "KMB", route: "67M", direction: "屯門", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/12E6D91298FABAEE/67M/1" },
            { busCoId: "KMB", route: "58M", direction: "葵芳", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/10860B611840CF22/58M/1" },
            { busCoId: "KMB", route: "67M", direction: "葵芳", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/10860B611840CF22/67M/1" },
            { busCoId: "KMB", route: "A38", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B7F443B0BB14A4EC/A38/1" },
            { busCoId: "MTR", route: "AEL", direction: "香港", stopName: "機場", targetSrc: "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=AEL&sta=AIR", mtrDir: "DOWN" },
            { busCoId: "MTR", route: "AEL", direction: "機場", stopName: "青衣", targetSrc: "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=AEL&sta=TSY", mtrDir: "UP" }
        ];

        function getFormattedHeaderTime() {
            const now = new Date();
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const day = String(now.getDate()).padStart(2, '0');
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
        }

        function updateTitleTime() {
            const titleEl = document.getElementById("titleContainer");
            if (titleEl) {
                titleEl.textContent = `荃景圍交通 ${getFormattedHeaderTime()}`;
            }
        }

        function parseEtaToMinutes(etaStr) {
            if (!etaStr) return null;
            // Support both ISO format and MTR format ("YYYY-MM-DD HH:mm:ss")
            let formattedStr = etaStr.replace(' ', 'T');
            if (!formattedStr.includes('+') && !formattedStr.endsWith('Z')) {
                formattedStr += '+08:00';
            }
            const etaDate = new Date(formattedStr);
            if (isNaN(etaDate.getTime())) return null;

            const now = new Date();
            const diffMs = etaDate - now;
            const diffMin = Math.floor(diffMs / 60000);
            
            // Allow 0 or slightly past arrival (up to -1 min) to display as 0 ("到著")
            if (diffMin < 0) {
                if (diffMs > -90000) return 0; // Bus arriving / just arrived
                return null;
            }
            return diffMin;
        }

        async function fetchInstructionETA(item) {
            try {
                const response = await fetch(item.targetSrc);
                if (!response.ok) return null;
                const json = await response.json();

                let diffs = [];

                // 1. Check GMB / ETA-Route-Stop JSON style
                if (json.type === "ETA-Route-Stop" || (json.data && json.data.eta)) {
                    const list = json.data && json.data.eta ? json.data.eta : [];
                    for (const entry of list) {
                        if (typeof entry.diff === 'number') {
                            diffs.push(entry.diff);
                        } else if (entry.timestamp) {
                            const min = parseEtaToMinutes(entry.timestamp);
                            if (min !== null) diffs.push(min);
                        }
                    }
                }
                // 2. Check MTR API response
                else if (item.busCoId === "MTR" && json.data) {
                    const staKey = item.targetSrc.includes("sta=AIR") ? "AEL-AIR" : "AEL-TSY";
                    const stData = json.data[staKey];
                    if (stData) {
                        const mtrList = stData[item.mtrDir] || [];
                        for (const entry of mtrList) {
                            if (entry.time) {
                                const min = parseEtaToMinutes(entry.time);
                                if (min !== null) diffs.push(min);
                            }
                        }
                    }
                }
                // 3. Standard KMB API response
                else if (json.data && Array.isArray(json.data)) {
                    let list = json.data;
                    if (item.specialDir) {
                        list = list.filter(x => x.dir === item.specialDir);
                    }
                    for (const entry of list) {
                        if (entry.eta) {
                            const min = parseEtaToMinutes(entry.eta);
                            if (min !== null) diffs.push(min);
                        }
                    }
                }

                // Clean & slice top 3 valid ETAs
                diffs = diffs.filter(v => v !== null && v >= 0).slice(0, 3);
                return diffs.length > 0 ? diffs : null;
            } catch (err) {
                // Exception handling when API fails or overnight service ended
                return null;
            }
        }

        function createEtaBadgeHTML(minutes) {
            let colorClass = "eta-green";
            let displayVal = minutes;

            if (minutes === 0) {
                displayVal = "到著";
                colorClass = "eta-red";
            } else if (minutes < 9) {
                colorClass = "eta-red";
            } else if (minutes >= 9 && minutes <= 15) {
                colorClass = "eta-orange";
            } else {
                colorClass = "eta-green";
            }

            return `<span class="eta-badge ${colorClass}">${displayVal}</span>`;
        }

        async function fetchAndRenderAll() {
            updateTitleTime();

            // Fetch all ETA instruction lines concurrently
            const results = await Promise.all(instructions.map(async (item) => {
                const etaValues = await fetchInstructionETA(item);
                return { item, etaValues };
            }));

            const tbody = document.getElementById("etaTableBody");
            let htmlBuffer = "";

            for (const res of results) {
                // Skip the route if overnight buses ended or no replies/null
                if (!res.etaValues || res.etaValues.length === 0) {
                    continue;
                }

                const badgesHTML = res.etaValues.map(min => createEtaBadgeHTML(min)).join("");

                htmlBuffer += `
                    <tr>
                        <td class="col-dir">${res.item.direction}</td>
                        <td class="col-route"><span class="route-badge">${res.item.route}</span></td>
                        <td class="col-stop">${res.item.stopName}</td>
                        <td class="col-eta">
                            <div class="eta-container">${badgesHTML}</div>
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = htmlBuffer;
        }

        window.addEventListener("DOMContentLoaded", () => {
            fetchAndRenderAll();

            // Update title timestamp every second
            setInterval(updateTitleTime, 1000);

            // Hidden auto-refresh ETA data every 10 seconds without buttons or alerts
            setInterval(fetchAndRenderAll, 10000);
        });
    </script>
</body>
</html>
