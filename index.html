<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britan 交通 Bus ETA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .sticky-header th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            z-index: 10;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.97); }
        }

        .eta-arriving {
            animation: pulse-subtle 1.2s infinite ease-in-out;
        }

        /* Custom scrollbar for mobile overflow */
        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-2 md:p-4 max-w-7xl mx-auto antialiased">

    <!-- Header section -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-3 md:p-4 mb-3 shadow-lg flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
            <div class="p-2 bg-blue-600 rounded-xl text-white shadow-md shadow-blue-500/20">
                <i class="fa-solid fa-bus text-lg md:text-xl"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-xl font-black text-slate-100 tracking-tight">Britan 交通</h1>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- Clock display -->
            <div class="hidden sm:flex flex-col text-right">
                <div class="text-sm md:text-base font-bold font-mono text-emerald-400" id="desktopClock">--:--:--</div>
                <div class="text-[0.65rem] md:text-xs text-slate-400 font-mono" id="desktopDate">-- --- ----</div>
            </div>

            <!-- Auto refresh indicator -->
            <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-xl text-xs font-mono">
                <i class="fa-solid fa-arrows-rotate text-blue-400 text-xs" id="refreshIcon"></i>
                <span id="countdownText" class="text-slate-300 font-semibold">10s</span>
            </div>
        </div>
    </header>

    <!-- Main content container -->
    <main class="flex-1 flex flex-col min-h-0">
        <!-- List View Container -->
        <div id="listViewContainer" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex-1 flex flex-col">
            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse sticky-header">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs md:text-sm font-semibold tracking-wider">
                            <th class="py-2.5 px-2 md:py-3 md:px-3 w-16 md:w-24">路線</th>
                            <th class="py-2.5 px-2 md:py-3 md:px-3 w-24 md:w-40">目的地</th>
                            <th class="py-2.5 px-2 md:py-3 md:px-3 w-24 md:w-44">候車站</th>
                            <th class="py-2.5 px-2 md:py-3 md:px-3">預計到達時間 (分鐘)</th>
                        </tr>
                    </thead>
                    <tbody id="etaTableBody" class="divide-y divide-slate-800/60 font-medium">
                        <!-- Dynamic rows loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Empty state message -->
        <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-500">
            <i class="fa-solid fa-bus-simple text-4xl mb-2 text-slate-700"></i>
            <p class="text-sm">沒有符合條件的路線班次</p>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // Instructions dataset with route configurations
        const defaultInstructions = [
            { id: "1", busCoId: "KMB", route: "234A", direction: "荃灣站", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/9E970734315233A2/234A/1" },
            { id: "2", busCoId: "KMB", route: "234B", direction: "荃灣站", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/9E970734315233A2/234B/1" },
            { id: "3", busCoId: "KMB", route: "234X", direction: "尖沙咀東", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/9E970734315233A2/234X/1" },
            { id: "4", busCoId: "KMB", route: "40", direction: "麗港城", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/95797E4D2901A516/40/1" },
            { id: "5", busCoId: "KMB", route: "48X", direction: "禾輋", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/D8F172EF79F3414D/48X/1" },
            { id: "6", busCoId: "KMB", route: "34", direction: "葵盛", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/939FE9A08B99174C/34/1" },
            { id: "7", busCoId: "KMB", route: "34M", direction: "荃灣站", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/939FE9A08B99174C/34M/1" },
            { id: "8", busCoId: "KMB", route: "A38", direction: "機場", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/1D7A47D38CE1E6D7/A38/1" },
            { id: "9", busCoId: "KMB", route: "934", direction: "灣仔", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/939FE9A08B99174C/934/1" },
            { id: "10", busCoId: "KMB", route: "A38", direction: "荃景圍天橋", stopName: "機場", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/7CB61EFB024D9025/A38/1", specialDir: "I" },
            { id: "11", busCoId: "KMB", route: "68A", direction: "青衣站", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED364A58F885DC92/68A/1" },
            { id: "12", busCoId: "KMB", route: "58M", direction: "屯門", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/12E6D91298FABAEE/58M/1" },
            { id: "13", busCoId: "KMB", route: "67M", direction: "屯門", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/12E6D91298FABAEE/67M/1" },
            { id: "14", busCoId: "KMB", route: "58M", direction: "葵芳", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/10860B611840CF22/58M/1" },
            { id: "15", busCoId: "KMB", route: "67M", direction: "葵芳", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/10860B611840CF22/67M/1" },
            { id: "16", busCoId: "KMB", route: "A38", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/B7F443B0BB14A4EC/A38/1" },
            { id: "17", busCoId: "MTR", route: "機場快綫", direction: "香港", stopName: "機場站", targetSrc: "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=AEL&sta=AIR", mtrDir: "DOWN" },
            { id: "18", busCoId: "MTR", route: "機場快綫", direction: "機場", stopName: "青衣站", targetSrc: "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=AEL&sta=TSY", mtrDir: "UP" }
        ];

        // State variables
        let currentInstructions = [...defaultInstructions];
        let lastFetchedData = [];
        let countdownSec = 10;
        let timerInterval = null;

        function parseEtaToMinutes(etaStr) {
            if (!etaStr) return null;
            let formattedStr = etaStr.replace(' ', 'T');
            if (!formattedStr.includes('+') && !formattedStr.endsWith('Z')) {
                formattedStr += '+08:00';
            }
            const etaDate = new Date(formattedStr);
            if (isNaN(etaDate.getTime())) return null;

            const now = new Date();
            const diffMs = etaDate - now;
            const diffMin = Math.floor(diffMs / 60000);

            if (diffMin < 0) {
                if (diffMs > -90000) return 0; // Bus arriving or just arrived
                return null;
            }
            return diffMin;
        }

        async function fetchInstructionETA(item) {
            try {
                const response = await fetch(item.targetSrc);
                if (!response.ok) return null;
                const json = await response.json();

                let diffs = [];

                if (json.type === "ETA-Route-Stop" || (json.data && json.data.eta)) {
                    const list = json.data && json.data.eta ? json.data.eta : [];
                    for (const entry of list) {
                        if (typeof entry.diff === 'number') {
                            diffs.push(entry.diff);
                        } else if (entry.timestamp) {
                            const min = parseEtaToMinutes(entry.timestamp);
                            if (min !== null) diffs.push(min);
                        }
                    }
                } else if (item.busCoId === "MTR" && json.data) {
                    const staKey = item.targetSrc.includes("sta=AIR") ? "AEL-AIR" : "AEL-TSY";
                    const stData = json.data[staKey];
                    if (stData) {
                        const mtrList = stData[item.mtrDir] || [];
                        for (const entry of mtrList) {
                            if (entry.time) {
                                const min = parseEtaToMinutes(entry.time);
                                if (min !== null) diffs.push(min);
                            }
                        }
                    }
                } else if (json.data && Array.isArray(json.data)) {
                    let list = json.data;
                    if (item.specialDir) {
                        list = list.filter(x => x.dir === item.specialDir);
                    }
                    for (const entry of list) {
                        if (entry.eta) {
                            const min = parseEtaToMinutes(entry.eta);
                            if (min !== null) diffs.push(min);
                        }
                    }
                }

                diffs = diffs.filter(v => v !== null && v >= 0).slice(0, 3);
                return diffs.length > 0 ? diffs : null;
            } catch (err) {
                return null;
            }
        }

        function createEtaBadgeHTML(minutes) {
            let colorClass = "bg-emerald-600 text-white";
            let displayVal = minutes === 0 ? "到著" : minutes;
            let extraClass = "";

            if (minutes === 0 || minutes < 9) {
                colorClass = "bg-red-600 text-white font-black";
                if (minutes === 0 || minutes <= 2) {
                    extraClass = "eta-arriving";
                }
            } else if (minutes >= 9 && minutes <= 15) {
                colorClass = "bg-amber-600 text-white";
            } else {
                colorClass = "bg-emerald-600 text-white";
            }

            return `<span class="inline-flex items-center justify-center px-1.5 md:px-2.5 py-0.5 md:py-1 rounded-md md:rounded-lg text-xs md:text-sm font-bold min-w-[1.75rem] md:min-w-[2.2rem] shadow-sm flex-shrink-0 ${colorClass} ${extraClass}">
                ${displayVal}${minutes !== 0 ? '<span class="text-[0.6rem] md:text-[0.65rem] ml-0.5 opacity-80">分</span>' : ''}
            </span>`;
        }

        async function fetchAndRenderAll() {
            const refreshIcon = document.getElementById("refreshIcon");
            if (refreshIcon) refreshIcon.classList.add("fa-spin");

            const results = await Promise.all(currentInstructions.map(async (item) => {
                const etaValues = await fetchInstructionETA(item);
                return { item, etaValues };
            }));

            lastFetchedData = results;
            renderUI();

            if (refreshIcon) {
                setTimeout(() => refreshIcon.classList.remove("fa-spin"), 500);
            }

            countdownSec = 10;
        }

        function renderUI() {
            const tbody = document.getElementById("etaTableBody");
            const emptyState = document.getElementById("emptyState");

            if (lastFetchedData.length === 0) {
                tbody.innerHTML = "";
                emptyState.classList.remove("hidden");
                return;
            } else {
                emptyState.classList.add("hidden");
            }

            let listHTML = "";

            lastFetchedData.forEach(res => {
                const { item, etaValues } = res;

                let badgesHTML = '<span class="text-xs text-slate-500 font-normal">尾班車已過 / 暫無服務</span>';
                if (etaValues && etaValues.length > 0) {
                    badgesHTML = etaValues.map(min => createEtaBadgeHTML(min)).join('');
                }

                listHTML += `
                    <tr class="hover:bg-slate-800/40 transition-colors border-b border-slate-800/40">
                        <td class="py-2.5 px-2 md:py-3 md:px-3">
                            <div class="inline-flex items-center gap-1 px-1.5 md:px-2.5 py-0.5 md:py-1 rounded-md md:rounded-lg bg-blue-600 text-white font-extrabold tracking-wide text-xs md:text-sm shadow">
                                ${item.route}
                            </div>
                        </td>
                        <td class="py-2.5 px-2 md:py-3 md:px-3">
                            <div class="font-bold text-slate-100 text-xs md:text-base truncate">
                                <span>${item.direction}</span>
                            </div>
                        </td>
                        <td class="py-2.5 px-2 md:py-3 md:px-3 text-slate-300 text-xs md:text-sm">
                            <span class="inline-flex items-center bg-slate-800 px-1.5 md:px-2 py-0.5 rounded border border-slate-700 truncate max-w-full">
                                ${item.stopName}
                            </span>
                        </td>
                        <td class="py-2.5 px-2 md:py-3 md:px-3">
                            <div class="flex items-center flex-nowrap gap-1 md:gap-1.5 overflow-x-auto">
                                ${badgesHTML}
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = listHTML;
        }

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById("desktopClock");
            const dateEl = document.getElementById("desktopDate");

            if (clockEl) {
                clockEl.textContent = now.toLocaleTimeString('zh-HK', { hour12: false });
            }
            if (dateEl) {
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                dateEl.textContent = now.toLocaleDateString('en-GB', options);
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                updateClock();

                countdownSec--;
                const countdownText = document.getElementById("countdownText");
                if (countdownText) {
                    countdownText.textContent = `${countdownSec}s`;
                }

                if (countdownSec <= 0) {
                    fetchAndRenderAll();
                }
            }, 1000);
        }

        window.addEventListener("DOMContentLoaded", () => {
            updateClock();
            fetchAndRenderAll();
            startTimer();
        });
    </script>
</body>
</html>
