<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus ETA 1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            margin: 0;
            padding: 8px;
            -webkit-text-size-adjust: 100%;
        }

        .eta-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        .eta-table th, .eta-table td {
            font-size: 15px;
            text-align: left;
            padding: 6px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        .eta-table th {
            color: #9ca3af;
            font-weight: 600;
            border-bottom: 1px solid #374151;
        }

        .eta-table tr {
            border-bottom: 1px solid #1f2937;
        }

        /* Badge styling */
        .badge-route {
            background-color: #2563eb;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            font-weight: bold;
            font-size: 15px;
        }

        .badge-eta {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            margin-right: 4px;
            min-width: 26px;
            text-align: center;
        }

        .eta-red {
            background-color: #dc2626;
        }

        .eta-orange {
            background-color: #ea580c;
        }

        .eta-green {
            background-color: #16a34a;
        }

        .header-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            padding: 4px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto">
        <div id="title-line" class="header-title">
            荃景圍交通 --Loading--
        </div>

        <table class="eta-table">
            <thead>
                <tr>
                    <th style="width: 20%;">前往</th>
                    <th style="width: 20%;">路線</th>
                    <th style="width: 28%;">車站</th>
                    <th style="width: 32%;">分鐘</th>
                </tr>
            </thead>
            <tbody id="eta-rows">
                <!-- Rows injected dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        const busInstructions = [
            { busCoId: "KMB", route: "234A", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/9E970734315233A2/234A/1" },
            { busCoId: "KMB", route: "234B", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/BFA3460955AC820C/234B/1" },
            { busCoId: "KMB", route: "234X", direction: "尖沙咀", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/BFA3460955AC820C/234X/1" },
            { busCoId: "KMB", route: "40", direction: "麗港城", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/95797E4D2901A516/40/1" },
            { busCoId: "KMB", route: "48X", direction: "禾輋", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/BFA3460955AC820C/48X/1" },
            { busCoId: "KMB", route: "34", direction: "葵盛", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/BFA3460955AC820C/34/1" },
            { busCoId: "KMB", route: "34M", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/939FE9A08B99174C/34M/1" },
            { busCoId: "KMB", route: "A38", direction: "機場", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/2C9BABEC2D1F04A3/A38/1" },
            { busCoId: "KMB", route: "934", direction: "灣仔", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/939FE9A08B99174C/934/1" },
            { busCoId: "KMB", route: "A38", direction: "荃景圍天橋", stopName: "機場", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/route-stop/A38/outbound/1" },
            { busCoId: "KMB", route: "68A", direction: "青衣站", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/ED364A58F885DC92/68A/1" },
            { busCoId: "KMB", route: "58M", direction: "屯門", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/10860B611840CF22/58M/1" },
            { busCoId: "KMB", route: "67M", direction: "屯門", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/10860B611840CF22/67M/1" },
            { busCoId: "KMB", route: "58M", direction: "葵芳", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/10860B611840CF22/58M/1" },
            { busCoId: "KMB", route: "67M", direction: "葵芳", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/10860B611840CF22/67M/1" },
            { busCoId: "KMB", route: "A38", direction: "荃灣", stopName: "荃景圍天橋", targetSrc: "https://data.etabus.gov.hk/v1/transport/kmb/eta/2C9BABEC2D1F04A3/A38/1" }
        ];

        function getHKTime() {
            const now = new Date();
            const options = {
                timeZone: 'Asia/Hong_Kong',
                year: 'numeric',
                month: 'short',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const formatter = new Intl.DateTimeFormat('en-GB', options);
            const parts = formatter.formatToParts(now);
            const map = {};
            parts.forEach(p => map[p.type] = p.value);
            return `${map.day}-${map.month}-${map.year} ${map.hour}:${map.minute}:${map.second}`;
        }

        function updateTitleTime() {
            const timeStr = getHKTime();
            document.getElementById('title-line').innerText = `荃景圍交通 ${timeStr}`;
        }

        async function fetchETAForItem(item) {
            try {
                const response = await fetch(item.targetSrc);
                if (!response.ok) return [];
                const json = await response.json();
                const etas = [];
                const now = new Date();

                if (json.type === "ETA-Route-Stop" || (json.data && !Array.isArray(json.data) && json.data.eta)) {
                    const etaList = (json.data && json.data.eta) ? json.data.eta : [];
                    for (const entry of etaList) {
                        if (entry.diff !== undefined && entry.diff !== null) {
                            const val = parseInt(entry.diff, 10);
                            if (!isNaN(val) && val >= 0) etas.push(val);
                        } else if (entry.timestamp) {
                            const etaTime = new Date(entry.timestamp);
                            const diffMin = Math.floor((etaTime - now) / 60000);
                            if (diffMin >= 0) etas.push(diffMin);
                        }
                    }
                } else if (Array.isArray(json.data)) {
                    for (const entry of json.data) {
                        if (entry.eta) {
                            const etaTime = new Date(entry.eta);
                            const diffMin = Math.floor((etaTime - now) / 60000);
                            if (diffMin >= 0) etas.push(diffMin);
                        }
                    }
                }

                // Sort numerically ascending and return top 3
                return etas.sort((a, b) => a - b).slice(0, 3);
            } catch (err) {
                // Return empty list on failure or finished overnight route
                return [];
            }
        }

        function getEtaBadgeClass(etaVal) {
            if (etaVal < 9) return 'eta-red';
            if (etaVal >= 9 && etaVal <= 15) return 'eta-orange';
            return 'eta-green';
        }

        async function updateAllETAs() {
            updateTitleTime();
            
            const fetchPromises = busInstructions.map(async (item) => {
                const etas = await fetchETAForItem(item);
                return { item, etas };
            });

            const results = await Promise.waitAll ? await Promise.waitAll(fetchPromises) : await Promise.all(fetchPromises);
            const tbody = document.getElementById('eta-rows');
            tbody.innerHTML = '';

            results.forEach(({ item, etas }) => {
                // Skip route if there are no more buses available
                if (!etas || etas.length === 0) return;

                const tr = document.createElement('tr');

                // Column 1: Direction
                const tdDir = document.createElement('td');
                tdDir.textContent = item.direction;
                tr.appendChild(tdDir);

                // Column 2: Route (Blue rectangular background)
                const tdRoute = document.createElement('td');
                const routeBadge = document.createElement('span');
                routeBadge.className = 'badge-route';
                routeBadge.textContent = item.route;
                tdRoute.appendChild(routeBadge);
                tr.appendChild(tdRoute);

                // Column 3: Stop Name
                const tdStop = document.createElement('td');
                tdStop.textContent = item.stopName;
                tr.appendChild(tdStop);

                // Column 4: ETA Badges (left-aligned, color coded)
                const tdEta = document.createElement('td');
                etas.forEach(etaVal => {
                    const etaBadge = document.createElement('span');
                    etaBadge.className = `badge-eta ${getEtaBadgeClass(etaVal)}`;
                    etaBadge.textContent = etaVal;
                    tdEta.appendChild(etaBadge);
                });
                tr.appendChild(tdEta);

                tbody.appendChild(tr);
            });
        }

        window.onload = function() {
            updateAllETAs();
            
            // Live clock ticker
            setInterval(updateTitleTime, 1000);

            // Silent auto-refresh every 10 seconds without UI indicators
            setInterval(updateAllETAs, 10000);
        };
    </script>
</body>
</html>
